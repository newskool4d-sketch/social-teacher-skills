# 표준 라이브러리 전용 검사 층만 돌린다 — 렌더 스모크(내장 최소 게이트 G1~G6 포함),
# 한글 무결성, DoD, HWPX 구조 품질 검사기(S·F·C·P), 렌더러 사본 동일.
# 렌더본은 저장소에 커밋하지 않는 정책(pilot/*/out*)이므로 CI가 파일럿을 매번 새로
# 렌더해 검사한다 — 항상 현재 렌더러를 검사하게 된다.
# 파일럿 8종은 사회과 밴드와 v0.2.0 신규 과목을 하나씩 맡는다 —
# 초3–4 / 초5–6 / 중 사회 / 고 통합사회1 / 중 역사 / 한국사1 / 경제 / 법과 사회.
# 성취기준 원문의 판정 근거는 각 파일럿의 ground-truth.md에 있다.
# 한컴 COM 실열림·PDF 쪽 채움 실측은 한글이 필요해 CI에 들어올 수 없다 —
# 그 층은 로컬 품질 루프가 맡는다 (docs/hwpx-quality-loop.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # 러너에 한글이 없다 — HWPX는 내장 렌더러 산출물을 검사한다(한글 엔진은 로컬 전용).
      HWPX_ENGINE: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 두 스킬이 렌더러를 각자 동봉한다 — "사본 동일" 원칙. 한쪽만 고친 PR을 여기서 막는다.
      - name: 렌더러 사본 동일 (공유 파일 8종)
        run: |
          for f in check_hwpx_min.py lesson_common.py render_documents.py \
                   render_lesson_html.py render_lesson_hwpx.py theme.css \
                   render_text.py hancom_engine.py; do
            cmp "plugin/skills/ko12-lesson-planning/scripts/$f" \
                "plugin/skills/ko12-lesson-differentiation/scripts/$f"
          done

      - name: 스모크 렌더 + 한글 무결성
        run: |
          bash plugin/skills/ko12-lesson-planning/scripts/render_all.sh \
            tests/smoke/korean_lesson.json /tmp/ci-smoke html,txt,md,hwpx
          python tests/smoke/check_hwpx.py /tmp/ci-smoke

      # DoD는 완전한 수업 패키지의 계약(렌더 무결성·시간 합계·3범주·인용 1회) —
      # 파일럿 8종을 새로 렌더한 산출물에 건다.
      - name: 파일럿 수업 렌더 + DoD (8종)
        run: |
          for p in elementary middle-school random-elementary high-integrated \
                   middle-history korean-history elective-econ elective-law; do
            bash plugin/skills/ko12-lesson-planning/scripts/render_all.sh \
              "pilot/$p/lesson.json" "/tmp/out-$p" html,txt,md,hwpx
            python tests/check_lesson.py "pilot/$p/lesson.json" "/tmp/out-$p"
          done

      - name: 파일럿 차별화 렌더 (4종)
        run: |
          for p in elementary middle-school random-elementary middle-history; do
            bash plugin/skills/ko12-lesson-differentiation/scripts/render_all.sh \
              "pilot/$p/differentiation.json" "/tmp/diff-$p" html,txt,md,hwpx
          done

      # 기본 형식(html·txt·md)만 요청하면 hwpx를 만들지 않아야 하고, 문서마다 세 형식이 다 있어야 한다.
      - name: 기본 출력 형식 (html·txt·md, hwpx 없음)
        run: |
          bash plugin/skills/ko12-lesson-planning/scripts/render_all.sh \
            pilot/middle-school/lesson.json /tmp/default-out
          test -z "$(ls /tmp/default-out/*.hwpx 2>/dev/null)"
          for f in /tmp/default-out/*.html; do
            b="${f%.html}"
            test -s "$b.txt" && test -s "$b.md"
            ! grep -q $'\xef\xbf\xbd' "$b.txt" "$b.md"
          done

      - name: HWPX 품질 검사기 — 렌더 산출물 전체
        run: |
          python tests/check_hwpx_quality.py /tmp/ci-smoke \
            /tmp/out-elementary /tmp/out-middle-school \
            /tmp/out-random-elementary /tmp/out-high-integrated \
            /tmp/out-middle-history /tmp/out-korean-history \
            /tmp/out-elective-econ /tmp/out-elective-law \
            /tmp/diff-elementary /tmp/diff-middle-school \
            /tmp/diff-random-elementary /tmp/diff-middle-history
